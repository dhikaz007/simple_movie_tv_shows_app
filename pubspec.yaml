name: simple_movie_tv_shows_app
description: A new Flutter project.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.2 <4.0.0"

dependencies:
  auto_size_text: ^3.0.0
  bloc: ^8.1.4
  cached_network_image: ^3.4.0
  change_app_package_name: ^1.4.0
  connectivity_plus: ^6.1.0
  dio: ^5.7.0
  equatable: ^2.0.7
  fk_user_agent: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_dotenv: ^5.2.1
  flutter_modular: ^6.3.4
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.15
  gap: ^3.0.1
  google_nav_bar: ^5.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  infinite_scroll_pagination: ^4.1.0
  intl: ^0.19.0
  loader_overlay: ^4.0.3
  logger: ^2.5.0
  path_provider: ^2.1.5
  pretty_dio_logger: ^1.4.0
  quickalert: ^1.1.0
  rename: ^3.0.2
  shared_preferences: ^2.3.3
  shimmer: ^3.0.0

dev_dependencies:
  build_runner: ^2.4.11
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/env/
    - assets/font/

fonts:
  - family: Montserrat
    fonts:
      - asset: assets/font/Montserrat-Black.ttf
        weight: 900
      - asset: assets/font/Montserrat-ExtraBold.ttf
        weight: 800
      - asset: assets/font/Montserrat-Bold.ttf
        weight: 700
      - asset: assets/font/Montserrat-SemiBold.ttf
        weight: 600
      - asset: assets/font/Montserrat-Medium.ttf
        weight: 500
      - asset: assets/font/Montserrat-Regular.ttf
        weight: 400
      - asset: assets/font/Montserrat-Light.ttf
        weight: 300
      - asset: assets/font/Montserrat-ExtraLight.ttf
        weight: 200
      - asset: assets/font/Montserrat-Thin.ttf
        weight: 100
