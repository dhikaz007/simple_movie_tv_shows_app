name: simple_movie_tv_shows_app
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.2 <4.0.0"

dependencies:
  bloc: ^8.1.4
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  dio: ^5.7.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_dotenv: ^5.2.1
  flutter_modular: ^6.3.4
  flutter_svg: ^2.0.14
  gap: ^3.0.1
  google_nav_bar: ^5.0.7
  loader_overlay: ^4.0.3
  pretty_dio_logger: ^1.4.0
  quickalert: ^1.1.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/env/
    - assets/font/

fonts:
  - family: Montserrat
    fonts:
      - asset: assets/font/Montserrat-Black.ttf
        weight: 900
      - asset: assets/font/Montserrat-ExtraBold.ttf
        weight: 800
      - asset: assets/font/Montserrat-Bold.ttf
        weight: 700
      - asset: assets/font/Montserrat-SemiBold.ttf
        weight: 600
      - asset: assets/font/Montserrat-Medium.ttf
        weight: 500
      - asset: assets/font/Montserrat-Regular.ttf
        weight: 400
      - asset: assets/font/Montserrat-Light.ttf
        weight: 300
      - asset: assets/font/Montserrat-ExtraLight.ttf
        weight: 200
      - asset: assets/font/Montserrat-Thin.ttf
        weight: 100
